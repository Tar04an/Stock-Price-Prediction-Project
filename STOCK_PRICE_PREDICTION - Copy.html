<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Price Prediction System</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f7fa;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 2px 10px #ddd;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 5px;
}

input, select {
    width: 95%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    background: #27ae60;
    color: white;
    padding: 12px 20px;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 15px;
}

button:hover {
    background: #219150;
}

.btn-eda {
    background: #2980b9;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 5px;
    background: #eef9f1;
}

.charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

.chart-card {
    width: 100%;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 5px;
}

.chart-card img {
    width: 100%;
    height: 300px;
    object-fit: contain;
}

/* Make detailed graphs full width */
.chart-card:nth-child(1),
.chart-card:nth-child(3),
.chart-card:nth-child(4),
.chart-card:nth-child(5),
.chart-card:nth-child(6),
.chart-card:nth-child(7),
.chart-card:nth-child(9),
.chart-card:nth-child(10) {
    grid-column: 1 / -1;
}

/* Increase height of detailed graphs */
.chart-card:nth-child(1) img,
.chart-card:nth-child(3) img,
.chart-card:nth-child(6) img,
.chart-card:nth-child(7) img,
.chart-card:nth-child(10) img {
    height: 450px;
}

/* Extra height for complex graphs */
.chart-card:nth-child(4) img,
.chart-card:nth-child(5) img,
.chart-card:nth-child(9) img {
    height: 550px;
}

.message {
    margin-top: 12px;
    color: #555;
}

.error {
    color: #c0392b;
}

@media(max-width: 600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .charts {
        grid-template-columns: 1fr;
    }

    .chart-card {
        grid-column: 1 / -1;
    }

    .chart-card img {
        height: 300px;
    }
}
</style>

</head>
<body>
<div class="container">
    <h2>Stock Price Prediction System</h2>
    <p>Select a company, view EDA graphs and predict its next trading day's closing price.</p>

    <h3>Exploratory Data Analysis</h3>
    <button type="button" class="btn-eda" onclick="fetchEDA()">Fetch EDA Graphs</button>
    <p id="edaMessage" class="message"></p>
    <div id="edaSection" class="charts"></div>

    <hr style="margin:25px 0">
    <h3>Stock Prediction Input</h3>
    <form id="predictionForm">
        <div class="grid">
            <div><label>Company / Brand Name:</label><select id="company" required><option value="">Loading companies...</option></select></div>
            <div><label>Stock Ticker:</label><input id="tickerDisplay" readonly></div>
            <div><label>Industry:</label><input id="industry" readonly></div>
            <div><label>Country:</label><input id="country" readonly></div>
            <div><label>Latest Trading Date:</label><input type="date" id="date" required></div>
            <div><label>Open Price:</label><input type="number" id="open" step="any" min="0" required></div>
            <div><label>High Price:</label><input type="number" id="high" step="any" min="0" required></div>
            <div><label>Low Price:</label><input type="number" id="low" step="any" min="0" required></div>
            <div><label>Close Price:</label><input type="number" id="close" step="any" min="0" required></div>
            <div><label>Trading Volume:</label><input type="number" id="volume" step="any" min="0" required></div>
            <div><label>Dividends (0 if none):</label><input type="number" id="dividends" value="0" step="any" min="0"></div>
            <div><label>Stock Splits (0 if none):</label><input type="number" id="stock_splits" value="0" step="any" min="0"></div>
        </div>
        <button type="submit" id="predictButton">Predict Next Closing Price</button>
    </form>

    <p id="errorMessage" class="message error"></p>
    <div id="resultBox" class="result">
        <h3>Prediction Result</h3>
        <p id="companyResult"></p>
        <h2 id="predictedPrice"></h2>
        <p>Predicted next trading day's closing price</p>
        <p>The dataset does not specify a common currency.</p>
    </div>
</div>

<script>
// Replace this with the URL printed by your Colab Ngrok cell.
const BASE_URL = "PASTE YOUR NGROK URL HERE";
let companies = [];

// Load company names and details from the notebook.
async function loadCompanies() {
    try {
        const response = await fetch(BASE_URL + "/metadata", {
            headers: { "ngrok-skip-browser-warning": "true" }
        });
        const data = await response.json();
        if (data.status !== "success") throw new Error(data.message || "Could not load companies.");

        companies = data.companies;
        const select = document.getElementById("company");
        select.innerHTML = '<option value="">Select Company</option>';
        companies.forEach(c => {
            const option = document.createElement("option");
            option.value = c.Ticker;
            option.textContent = c.Brand_Name + " (" + c.Ticker + ")";
            select.appendChild(option);
        });
    } catch (error) {
        document.getElementById("errorMessage").innerText = "Connection error: " + error.message;
    }
}

// Display the selected company's ticker, industry and country.
document.getElementById("company").addEventListener("change", function () {
    const c = companies.find(item => item.Ticker === this.value);
    document.getElementById("tickerDisplay").value = c ? c.Ticker : "";
    document.getElementById("industry").value = c ? c.Industry_Tag : "";
    document.getElementById("country").value = c ? c.Country : "";
});

// Fetch the EDA graphs from /get_eda.

async function fetchEDA() {
    const section = document.getElementById("edaSection");
    document.getElementById("edaMessage").innerText = "Loading graphs...";
    section.innerHTML = "";

    try {
        const response = await fetch(BASE_URL + "/get_eda", {
            headers: { "ngrok-skip-browser-warning": "true" }
        });

        const data = await response.json();
        if (data.status !== "success")
            throw new Error("Could not fetch graphs.");

        const titles = {
            brand_distribution: "Stock Records by Brand",
            close_distribution: "Close Price Distribution",
            country_industry: "Country and Industry Records",
            correlation_heatmap: "Correlation Heatmap",
            ohlc_distribution: "Open, High, Low and Close",
            country_boxplot: "Stock Prices by Country",
            volume_scatter: "Trading Volume vs Close Price",
            dividend_distribution: "Dividend Distribution",
            pairplot: "Financial Features Pairplot",
            temporal_trend: "Stock Price Trends"
        };

        Object.entries(data.charts).forEach(([key, image]) => {
            const card = document.createElement("div");
            card.className = "chart-card";

            const heading = document.createElement("h3");
            heading.innerText = titles[key] || key;

            const img = document.createElement("img");
            img.src = image;
            img.alt = heading.innerText;

            card.appendChild(heading);
            card.appendChild(img);
            section.appendChild(card);
        });

        document.getElementById("edaMessage").innerText =
            "All EDA graphs loaded successfully.";

    } catch (error) {
        document.getElementById("edaMessage").innerText =
            "Error: " + error.message;
    }
}

// Send the entered stock values to /predict.
document.getElementById("predictionForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    const button = document.getElementById("predictButton");
    button.disabled = true;
    button.innerText = "Predicting...";
    document.getElementById("errorMessage").innerText = "";
    document.getElementById("resultBox").style.display = "none";

    const inputData = {
        ticker: document.getElementById("company").value,
        date: document.getElementById("date").value,
        open: Number(document.getElementById("open").value),
        high: Number(document.getElementById("high").value),
        low: Number(document.getElementById("low").value),
        close: Number(document.getElementById("close").value),
        volume: Number(document.getElementById("volume").value),
        dividends: Number(document.getElementById("dividends").value || 0),
        stock_splits: Number(document.getElementById("stock_splits").value || 0)
    };

    try {
        const response = await fetch(BASE_URL + "/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
            body: JSON.stringify(inputData)
        });
        const data = await response.json();
        if (data.status !== "success") throw new Error(data.message || "Prediction failed.");
        const c = companies.find(item => item.Ticker === inputData.ticker);
        document.getElementById("companyResult").innerText = c.Brand_Name + " (" + c.Ticker + ") - " + c.Industry_Tag + ", " + c.Country;
        document.getElementById("predictedPrice").innerText = Number(data.predicted_close).toFixed(4);
        document.getElementById("resultBox").style.display = "block";
    } catch (error) {
        document.getElementById("errorMessage").innerText = "Error: " + error.message;
    }
    button.disabled = false;
    button.innerText = "Predict Next Closing Price";
});

loadCompanies();
</script>
</body>
</html>
